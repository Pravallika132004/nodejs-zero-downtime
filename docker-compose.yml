services:

  app1:
    build: .
    image: nodejs-zero-downtime:v1
    container_name: zero-downtime-app1
    environment:
      NODE_ENV: production
      PORT: 3000
      VERSION: v1
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  app2:
    build: .
    image: nodejs-zero-downtime:v1
    container_name: zero-downtime-app2
    environment:
      NODE_ENV: production
      PORT: 3000
      VERSION: v1
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: zero-downtime-nginx
    ports:
      - "8888:80"
    volumes:
      - ./nginx:/etc/nginx:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    restart: unless-stopped